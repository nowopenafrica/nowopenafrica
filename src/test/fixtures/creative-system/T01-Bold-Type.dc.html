<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>T01 Bold typographic</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;family=Inter+Tight:wght@600;700;800&amp;family=Instrument+Serif:ital@0;1&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#2563EB}a:hover{color:#0B1222}
</style>
</helmet>
<div style="width: 1080px; height: 1350px; box-sizing: border-box; padding: 80px 72px 64px; background: {{bg}}; color: #FFFFFF; font-family: Inter, system-ui, sans-serif; display: flex; flex-direction: column; position: relative; overflow: hidden">
<img src="/_blob/059c81e3788ba0d78de619ada6365ac5" alt="" aria-hidden="true" style="position: absolute; right: -220px; top: -220px; width: 640px; height: 640px; display: block">
<span style="font-size: 24px; font-weight: 600; letter-spacing: 0.16em; text-transform: uppercase; position: relative">{{kicker}}</span>
<div style="margin-top: auto; display: flex; flex-direction: column; gap: 10px; font-family: 'Coolvetica', 'Inter Tight', sans-serif; font-weight: 700; letter-spacing: -0.045em; font-size: 168px; line-height: 0.84; letter-spacing: -0.06em"><span>{{line1}}</span><span style="color: #8FB4FF">{{line2}}</span></div>
<div style="margin-top: 48px; height: 6px; background: linear-gradient(90deg,#3B82F6,#8B5CF6,#EC4899,#F97316,#EAB308,#22C55E)"></div>
<div style="margin-top: 32px; display: flex; justify-content: space-between; align-items: center"><span style="padding: 20px 34px; border-radius: 999px; background: #FFFFFF; color: #0B1222; font-size: 28px; font-weight: 600">{{cta}} →</span><span style="font-family: 'Coolvetica', 'Inter Tight', sans-serif; font-weight: 700; letter-spacing: -0.045em; font-size: 26px; white-space: nowrap"><span style="color: #7FA6FF">NOWOPEN</span> AFRICA</span></div>
<sc-if value="{{comp}}" hint-placeholder-val="{{ true }}"><span style="position: absolute; right: 16px; top: 16px; padding: 6px 10px; background: #A65B00; color: #FFFFFF; font-family: ui-monospace, monospace; font-size: 14px; z-index: 5">T01 · L1 · A Brand announcements</span></sc-if>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"kicker": {"editor": "text", "default": "Campaign 01 \u00b7 AFRICA is NOWOPEN"}, "line1": {"editor": "text", "default": "Something bigger"}, "line2": {"editor": "text", "default": "is opening."}, "cta": {"editor": "text", "default": "Discover NowOpen"}, "bg": {"editor": "color", "default": "#0B1222", "options": ["#0B1222", "#2563EB", "#7C3AED"]}, "comp": {"editor": "boolean", "default": true}, "$preview": {"width": 1080, "height": 1350}}'>
class Component extends DCLogic {
  renderVals() {
    return { kicker: this.props.kicker ?? "Campaign 01 \u00b7 AFRICA is NOWOPEN", line1: this.props.line1 ?? "Something bigger", line2: this.props.line2 ?? "is opening.", cta: this.props.cta ?? "Discover NowOpen", bg: this.props.bg ?? "#0B1222", comp: this.props.comp ?? true };
  }
}
</script>
</body>
</html>
