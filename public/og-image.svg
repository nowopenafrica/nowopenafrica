<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-label="NowOpen Africa — the operating system for business growth in Africa">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1220"/>
      <stop offset="0.5" stop-color="#131a2e"/>
      <stop offset="1" stop-color="#0b1220"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#3b82f6"/>
      <stop offset="0.35" stop-color="#8b5cf6"/>
      <stop offset="0.7" stop-color="#ec4899"/>
      <stop offset="1" stop-color="#f97316"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect x="0" y="0" width="1200" height="8" fill="url(#accent)"/>

  <!-- Color-wheel brand mark -->
  <g transform="translate(100,96)">
    <circle cx="44" cy="14" r="14" fill="#3b82f6"/>
    <circle cx="68" cy="28" r="14" fill="#8b5cf6"/>
    <circle cx="68" cy="56" r="14" fill="#ec4899"/>
    <circle cx="44" cy="70" r="14" fill="#f97316"/>
    <circle cx="20" cy="56" r="14" fill="#eab308"/>
    <circle cx="20" cy="28" r="14" fill="#22c55e"/>
  </g>

  <text x="196" y="150" font-family="Arial, Helvetica, sans-serif" font-size="46" font-weight="800" fill="#ffffff" letter-spacing="1">NOWOPEN AFRICA</text>

  <text x="100" y="330" font-family="Arial, Helvetica, sans-serif" font-size="82" font-weight="800" fill="#ffffff">The Operating System</text>
  <text x="100" y="420" font-family="Arial, Helvetica, sans-serif" font-size="82" font-weight="800" fill="url(#accent)">for Business Growth in Africa</text>

  <text x="100" y="500" font-family="Arial, Helvetica, sans-serif" font-size="34" font-weight="500" fill="#94a3b8">Get discovered · Advertise everywhere · Create anything · Grow with AI</text>

  <text x="100" y="576" font-family="Arial, Helvetica, sans-serif" font-size="30" font-weight="700" fill="#c7d2fe">nowopenafrica.com</text>
  <text x="1100" y="576" text-anchor="end" font-family="Arial, Helvetica, sans-serif" font-size="26" font-weight="500" fill="#64748b">20+ African markets</text>
</svg>
