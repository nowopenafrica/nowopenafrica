<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>No connection — NowOpen Africa</title>
    <!--
      Deliberately self-contained: no stylesheet, no font, no script.

      This page is shown precisely when the network is gone, so anything it
      had to fetch would be the thing that fails. It is also the only HTML
      the service worker stores — see public/sw.js for why nothing else is.
    -->
    <style>
      :root { color-scheme: light dark; }
      body {
        margin: 0; min-height: 100svh; display: grid; place-items: center;
        padding: 24px; background: #0f172a; color: #e2e8f0;
        font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      }
      main { max-width: 26rem; text-align: center; }
      h1 { font-size: 1.5rem; margin: 0 0 .75rem; }
      p { margin: 0 0 1.25rem; line-height: 1.6; color: #94a3b8; font-size: .95rem; }
      button {
        min-height: 48px; padding: 0 1.5rem; border: 0; border-radius: .75rem;
        background: #2563eb; color: #fff; font-size: .95rem; font-weight: 700;
        cursor: pointer;
      }
      button:focus-visible { outline: 3px solid #93c5fd; outline-offset: 2px; }
      .mark { width: 56px; height: 56px; margin: 0 auto 1.25rem; display: block; }
    </style>
  </head>
  <body>
    <main>
      <img class="mark" src="/icon-192.png" alt="" width="56" height="56" />
      <h1>You are offline</h1>
      <!--
        Says what is true. NowOpen needs the network for searching, profiles,
        the dashboard and anything that costs money, so promising an offline
        mode would be a promise broken on the first tap.
      -->
      <p>
        NowOpen needs an internet connection to find businesses, open your
        dashboard and create designs. Reconnect and try again — nothing you
        were doing has been lost.
      </p>
      <button type="button" onclick="location.reload()">Try again</button>
    </main>
  </body>
</html>
